name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # astral-sh/setup-uv@v5
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "0.11.25"

      - name: Python
        run: uv python install 3.12

      - name: Sync
        run: uv sync --dev --extra eval --extra analytics --extra ui --group bfcl

      - name: Ruff (lint)
        run: uv run ruff check src tests scripts/

      - name: Ruff (format)
        run: uv run ruff format --check src tests scripts/

      - name: Shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh
          bash -n scripts/*.sh

      - name: Dependency advisory scan (locked)
        run: uv audit --preview-features audit-command

      - name: Production v1 gate
        run: make check-production-v1
