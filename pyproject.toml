[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bencheval"
version = "0.3.0"
description = "LLM benchmark evaluation tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6.0.3"]

[project.scripts]
bencheval = "bencheval.cli:main"

# Ship the public control-plane config tree inside the wheel so a non-editable /
# `uv tool install` is one-click: no exported bundle, no BENCHEVAL_HOME, no rsync.
# `bencheval.paths.repo_root()` resolves this via importlib.resources when there is
# no checkout or BENCHEVAL_HOME. Mirrors scripts/export-config-bundle.sh's subset
# (selftest fixtures and editable-only pricing are intentionally excluded).
[tool.hatch.build.targets.wheel.force-include]
"config/benchmarks.yaml" = "bencheval/_bundled/config/benchmarks.yaml"
"config/models.yaml" = "bencheval/_bundled/config/models.yaml"
"config/bfcl-v4-supported-models.yaml" = "bencheval/_bundled/config/bfcl-v4-supported-models.yaml"
"config/runtimes" = "bencheval/_bundled/config/runtimes"
"config/providers" = "bencheval/_bundled/config/providers"
"config/agents" = "bencheval/_bundled/config/agents"
"config/slices" = "bencheval/_bundled/config/slices"

[project.optional-dependencies]
eval = [
    # >=0.3.252: first release allowing click>=8.3.3 (GHSA/PYSEC click fix; older
    # inspect-ai caps click<8.2.2, which pins us to a vulnerable click).
    # Bounded: tested resolution is 0.3.x (uv.lock); 0.x minors may break.
    "inspect-ai>=0.3.252,<0.4.0",
    # Bounded: tested resolution is 0.8.x (uv.lock); 0.x minors may break.
    "inspect-evals>=0.8.0,<0.9.0",
    # >=0.5.0: drops the litellm<1.82.7 pin so litellm can move past its GHSA fixes.
    # Bounded: tested resolution is 0.7.x (uv.lock); 0.x minors may break.
    "inspect-harbor>=0.5.0,<0.8.0",
    # Bounded: tested resolution is 0.2.x (uv.lock); 0.x minors may break.
    "inspect-swe>=0.2.47,<0.3.0",
]
analytics = ["duckdb>=1.2.0", "pyarrow>=18.0.0"]

[dependency-groups]
dev = [
    "hypothesis>=6.155.3",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
]
bfcl = [
    # Exact adapter/catalog pin; this package supplies both `bfcl` and
    # `bfcl_eval`. Keep in a repository-owned group: its upstream exact pins
    # require the audited uv overrides below, which package extras cannot carry.
    "bfcl-eval==2026.3.23",
    # bfcl-eval 2026.3.23 eagerly imports qwen-agent at CLI startup but omits
    # this runtime dependency; without it even `bfcl --help` fails.
    "soundfile>=0.13.1,<0.14.0",
]

[tool.uv]
# bfcl-eval 2026.3.23 pins two vulnerable transitive versions even though its
# FileLock usage and datamodel compatibility branch support the patched APIs.
# Keep these overrides exact: they are part of the separately tested BFCL
# environment and must not silently move without re-running that smoke proof.
override-dependencies = [
    "datamodel-code-generator==0.64.0",
    "filelock==3.32.4",
]
# Security floor on a transitive dep: inspect-evals 0.8.0 depends on datasets
# unconstrained and resolved 4.8.4, flagged by PYSEC-2026-3716 (fixed in 5.0.1).
# A constraint, not a dependency: bencheval core never imports datasets; only
# the eval extra reaches it via inspect-evals (and hle_adapter at run time).
# openai>=2.45.0: inspect-ai 0.3.252 refuses to call OpenAI-compatible routes
# below that runtime floor (GPQA live failed on locked 2.31.0).
constraint-dependencies = ["datasets>=5.0.1", "openai>=2.45.0"]

[tool.ruff]
line-length = 100
target-version = "py312"
# config/selftest/**/workspaces/**/repo is intentional fixture data (mini-repos staged by
# the selftests, some deliberately representing OLD/backward-compatible configs). Never lint
# or reformat fixtures — modernizing them defeats their purpose.
extend-exclude = ["config/selftest"]

[tool.ruff.lint]
# Strict for correctness + hygiene, minus the noisy rules. Kept in sync with MOMO's
# pyproject.toml. Single source of truth for the gate and the editor (the ruff extension
# reads it) — do NOT re-add a global `ruff.lint.select` in editor settings. Excluded:
# S/bandit (assert nagging), PLR2004 (magic numbers), ANN, D, COM/ISC001, FBT/EM/TRY.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports) — correctness
    "I",   # isort (import order)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (real bug patterns)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "TID", # flake8-tidy-imports (no relative imports)
    "PGH", # pygrep-hooks (blanket noqa / type: ignore)
    "PLE", # pylint errors only (real errors, not refactor/convention)
    "DTZ", # flake8-datetimez (tz-aware datetimes) — correctness
    "RUF", # ruff-specific
]
ignore = [
    "PT011",  # pytest.raises(...) without match= — too noisy to require everywhere
    "PT017",  # assertion on the exception inside an `except` block — a valid pattern
    "PT018",  # "break up `assert a and b`" — a compound assert is often clearer as-is
    "B017",   # pytest.raises(Exception) — sometimes you only assert that *something* raises
    "SIM105", # contextlib.suppress over try/except/pass — try/except reads fine
    "SIM102", # nested `if` vs a single `and` — nesting is often the clearer read
    "RUF002", # ambiguous unicode in docstrings — `×` / en-dash are intentional in prose
    "RUF003", # ambiguous unicode in comments — same
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["bencheval"]
omit = ["*/tests/*"]

[tool.coverage.report]
# Full-suite fail_under is intentionally unset. Domain coverage gate lives in
# scripts/check-domain-coverage.sh (80% across the production package).
