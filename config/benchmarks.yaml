    category: reasoning
    tier: stretch
    adapter_status: manifest_available
    recommended_backend: inspect
    recommended_profile: E3
    task_count: 2500
    public_indexed: true
    contamination_risk: medium
    single_mode_required: false
    source_url: https://github.com/centerforaisafety/hle
    notes: >
      Model-only via the official CAIS HLE eval scripts (`cais/hle` host checkout,
      pinned per-script); the launched dataset is the official `cais/hle` HF
      dataset bound by the identity block below (immutable repo revision plus
      the LFS sha256 of the canonical test parquet, sourced from official HF
      API metadata and re-verified fail-closed against the real downloaded
      bytes before every launch). The dataset is gated: pre-warming the
      snapshot requires an authorized HF token. The earlier third-party
      `macabdul9/hle_text_only` mirror pin was reverted (review F002); the
      mirror may only return as a separately-named derivative benchmark.
      Requires judge step; smoke uses --max_samples.
      See docs/ops/benchmarks/hle.md.
    adapter_id: hle
    executable: true
    default_slice: smoke
    identity:
      kind: hf-dataset-snapshot
      repo: cais/hle
      revision: 5a81a4c7271a2a2a312b9a690f0c2fde837e4c29
      files:
        data/test-00000-of-00001.parquet: sha256:6d0ee0602e8aea6b159509577e884f48ecac7b8e3f6822a35f51335a446c726a
