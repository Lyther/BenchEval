    source_url: https://gorilla.cs.berkeley.edu/leaderboard.html
    notes: >
      Admitted: the bounded `bfcl generate` → `bfcl evaluate` lifecycle is
      scored only by the official `BFCL_v4_<category>_score.json` JSONL
      artifact (pinned upstream format), with launches gated on
      config/bfcl-v4-supported-models.yaml and the identity pin below.
      Admission trail (2026-08-24, dev-box-cpu): operator-reviewed lifecycle
      demonstration run-20260824-040631-228703-4756f857 (diagnostic-labeled,
      5/5 smoke categories officially scored — never registerable) plus the
      registered `passed` run run-20260824-045622-854659-a46ae44d
      (adapter_smoke, same 5/5 official scoring; see results/manifests/runs.jsonl).
      results/ is machine-local and gitignored, so those evidence paths exist
      only on the host that ran them. `--diagnostic` is refused for this
      now-executable row; diagnostic-labeled evidence can never register
      `passed`.
    adapter_id: bfcl
    executable: true
    default_slice: smoke-5
    identity:
