schema_version: "0.1"
runtime:
  id: "codex-cli"
  kind: "cli_agent"
  display_name: "Codex CLI"
  lifecycle: "external_process"
  supported_platforms: ["macos", "linux"]
  supported_harnesses:
    ["harbor", "swebench-native", "cybergym-native", "exploitgym-native"]
  model_binding: "runtime_configured"
launch:
  command_template: ["codex", "exec", "--json"]
  working_dir_policy: "ephemeral_workspace"
  env_vars_required: ["OPENAI_API_KEY"]
  env_vars_optional: []
  timeout_sec_default: 300
  # Closed Harbor driver binding (architecture §23.6): the upstream agent this
  # profile runs and the code-owned install recipe; the profile id selects nothing.
  harbor:
    agent: "codex"
    install_recipe: "codex_npm"
    setup_timeout_multiplier: 8
capabilities:
  reads_files: true
  edits_files: true
  runs_shell: true
  supports_mcp: false
  supports_subagents: false
  supports_hooks: true
  supports_noninteractive: true
  supports_json_output: "partial"
safety:
  # Provider egress via controlled host proxy is required for Harbor TB runs.
  network_default: "benchmark_required"
  workspace_boundary: "ephemeral_only"
  requires_user_approval: false
  forbidden_features_for_eval:
    - "external_network_unless_benchmark_requires"
    - "persistent_global_config_mutation"
versioning:
  version_command: ["codex", "--version"]
  config_hash_inputs: [".codex"]
  # Pinned agent version installed in the Harbor container; launch refuses
  # when absent.
  agent_version_pin: "0.148.0"
admission: "admitted"
